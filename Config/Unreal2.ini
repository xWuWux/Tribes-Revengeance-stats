; Fix for crash on modern Windows systems (high-refresh-rate monitors):
; "Assertion failed: (Size/Stride) <= 0xFFFF [D3DResource.cpp]"
;
; Set DesiredRefreshRate to match your monitor's refresh rate.
; Common values: 60, 75, 120, 144, 165, 240
; If unsure, start with 60.

[Engine.GameEngine]
DesiredRefreshRate=60
